name: check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Offline, deterministic gate: format, CSS, JS, HTML, unit tests, and the
  # vendor-sync guard. Network-dependent audits (fonts drift, external links)
  # live in maintenance.yml, not here.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run check
