name: maintenance
on:
  schedule:
    - cron: '0 3 * * 1' # weekly, Monday 03:00 UTC
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Network-dependent audits that must not gate PRs: font reproducibility
  # against mutable upstreams, and external link health.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - run: npm run audit:fonts
      - uses: lycheeverse/lychee-action@v2
        with:
          # vendor/ bundles contain URLs (false positives); --base resolves
          # relative links against the live site.
          args: --no-progress --exclude-path vendor/ --exclude-mail --base https://yikesable.github.io/vibe/ index.html stories/*.html codepen-converter/**/*.html component-explorations/*.html README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
